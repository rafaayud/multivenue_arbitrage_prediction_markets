[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "prediction-markets"
version = "0.1.0"
description = "Clean architecture framework for prediction markets data aggregation and trading."
readme = "README.md"
requires-python = ">=3.13"

authors = [
    { name = "Rafael Ayudarte López", email = "rafael.ayudartelopez12@gmail.com" },
    { name = "Ismael Meroño Galindo", email = "mgalindoismael2@gmail.com" },
    { name = "Javier Martínez Santamaría", email = "jmsquant123@gmail.com" },
    { name = "Néstor Zafrilla López", email = "nestorzafrillalopez@gmail.com" },
    { name = "David Zhan Zou", email = "davidzhan123@gmail.com" },
]

maintainers = [
    { name = "Romagooners Capital Management"},
]

dependencies = [
    "cryptography>=48.0.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.0",
    "limitless-sdk>=1.0.12",
    "nautilus-trader[polymarket]>=1.230.0",
    "polymarket-client>=0.4.0,<0.5.0",
    "predict-sdk>=0.0.20",
    "prometheus-client>=0.25.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "starlette>=1.3.1",
    "tenacity>=9.1.4",
    "uvicorn>=0.51.0",
    "websockets>=15.0",
]

[dependency-groups]
dev = [
    "graphifyy>=0.9.16",
    "openai>=2.45.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src", "."]
markers = [
    "integration: tests that call external services",
]
